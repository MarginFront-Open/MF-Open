# A starting point to adapt to your platform. Runs PostgreSQL for local development: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marginfront
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marginfront"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
