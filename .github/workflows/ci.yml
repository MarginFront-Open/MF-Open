name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Next.js and Turborepo report anonymous usage to Vercel unless told not to.
env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      - name: Lint
        run: npm run lint

      - name: Fail if lint changed any file
        run: git diff --exit-code

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000/v1"

  migrations:
    name: Migrations build the schema from an empty database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # 15 is the oldest version the baseline migration supports.
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marginfront_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marginfront_ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/marginfront_ci
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marginfront_ci_shadow
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      - name: Create the shadow database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE marginfront_ci_shadow"

      - name: Apply every migration, then fail if the result differs from schema.prisma
        run: npm run db:check-migrations --workspace=@marginfront/db

      - name: Generate the database client
        run: npm run db:generate --workspace=@marginfront/db

      - name: Load the price catalog offline, twice
        run: |
          npm run db:seed-pricing --workspace=@marginfront/db
          npm run db:seed-pricing --workspace=@marginfront/db

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan the working tree with gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1 -c .gitleaks.toml
